<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>报告页 v1 · 纸 + 章节栏 + 交付台 — Inquestry</title>
<style>
:root{
  --code:#0E1317; --bg:#141A1F; --panel:#1A2128; --panel-2:#212A32; --line:#273038;
  --text:#DFE5EC; --dim:#8A96A4;
  --ok:#5A9EDD; --accent:var(--ok); --bad:#C9564C; --warn:#E0A94A;
  --fill:#2A6598; --on-fill:#F2F8FD; --on-warn:#1A1206;
  --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  --line-soft:#1F2831; --dim-2:#6E7A87; --tint:#18222C;
  --head-h:46px;
  /* 章节栏的宽。**它与纸宽是一对**：rail + 它 + 1240 = 1468，窗口宽到这个数纸才按
     导出那个宽度断行，再窄纸就先让。加宽它等于把这个数往上抬——那行摘要放不下才加，
     不为了好看加 */
  --toc-w:176px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);
  font:13.5px/1.6 -apple-system,"SF Pro Text","PingFang SC",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid rgba(90,158,221,.55);outline-offset:2px;border-radius:4px}
svg{flex:0 0 auto}

/* 动作按钮一律 图标 + 字（ui.md §5）。画法与 Icon.tsx 同源：24 格、描边、currentColor */
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--panel-2);border:1px solid var(--line);
  color:var(--text);padding:5px 12px;border-radius:6px;font-size:12.5px}
.btn:hover{border-color:var(--dim-2)}
.btn.go{background:none;border-color:var(--fill);color:var(--accent)}
.btn.quiet{background:none;color:var(--dim)}
.btn.quiet:hover{color:var(--text)}

/* ══════════ mockup 自己的控制条，不属于方案 ══════════ */
.mock{position:fixed;left:0;right:0;bottom:0;z-index:80;display:flex;align-items:center;gap:10px;
  padding:7px 16px;background:#0B0F13;border-top:1px solid var(--line);font-size:11.5px;color:var(--dim)}
.mock b{color:var(--dim-2);font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-size:10px}
.mock button{background:transparent;border:1px solid var(--line);color:var(--dim);padding:2px 10px;border-radius:5px;font-size:11.5px}
.mock button.on{border-color:var(--fill);color:var(--accent)}
.mock .gap{flex:1}

/* ══════════ 外壳 ══════════════════════════════════════════════
   **一条整幅顶栏，不是两条**：报告屏与工作区共用同一条（左边标记与项目起点，右边这一屏的动作）。
   报告屏原先自己另起一条页头，于是同一个应用里出现了两种顶栏——差别一大就读成两个界面。 */
.app{display:grid;grid-template-columns:52px 1fr;grid-template-rows:var(--head-h) 1fr;height:100%;padding-bottom:34px}
.brand{grid-column:1/-1;display:flex;align-items:center;gap:10px;padding:0 20px 0 96px;
  background:var(--panel);border-bottom:1px solid var(--line)}
.brand .mark{width:18px;height:18px;border:1.5px solid var(--dim-2);border-radius:50%;position:relative}
.brand .mark::after{content:'';position:absolute;left:50%;top:50%;width:7px;height:7px;margin:-3.5px 0 0 -3.5px;border-radius:50%;background:var(--accent)}
.brand .who{font-family:var(--mono);font-size:11.5px;color:var(--dim)}
/* 这一屏的动作长在顶栏右端，与工作区那两枚同一个位置、同一个样子 */
.brand .acts{margin-left:auto;display:flex;gap:8px}
.rail{grid-column:1;grid-row:2;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0;
  background:var(--panel);border-right:1px solid var(--line)}
.rail i{width:36px;height:36px;border-radius:9px;display:block;background:transparent;border:1px solid transparent}
.rail i.on{background:var(--panel-2);border-color:var(--line)}

/* 不用 scroll-behavior:smooth：窗口未获焦点时它一帧都不跑（ui.md §11 那条过期帧的同族） */
.reportscreen{grid-column:2;grid-row:2;min-height:0;overflow-y:auto;background:var(--bg)}

/* 对照条：现在那一版的顶栏，只在 mockup 的对照开关下出现 */
.legacybar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-height:var(--head-h);
  padding:6px 24px;background:var(--panel);border-bottom:1px solid var(--line)}
.legacybar a{color:var(--dim);font-size:12.5px;text-decoration:none;padding:0 4px}

/* ══════════ 章节栏：竖直、吸附、带一行摘要 ══════════════════
   它不是目录，是**这份报告的骨架加读数**：每一节旁边那行小字说的是"这一节里有多少东西"，
   所以形态一换、数字就跟着换——竖着摆才装得下这行字，横着那条永远只能印章节名。
   最后一格是交付，与章节隔开：它不是报告的一节，是读完之后要做的事。 */
.cols{display:grid;grid-template-columns:var(--toc-w) 1fr;align-items:start}
/* **没有右边框**：它跟着这个吸附盒走，只有一屏那么高，页面一长就在半空断成一截。
   要分栏靠的是纸自己那 60px 内边距，不是再画一条画不到底的线。 */
.toc{position:sticky;top:0;padding:32px 16px 32px 24px;
  max-height:calc(100vh - var(--head-h) - 34px);overflow-y:auto}

/* 一条发丝轨道，当前那一节把自己这一段点亮。
   与报告里的时间轴、rail 上那枚当前标记是同一个母题（竖线 + 一段），所以它不是新东西。
   **不用圆点**：时间轴上圆点的填实 / 空心已经有含义了（ui.md §6），同屏再用一次就成了两套意思。
   ⚠️ 点亮那一段画在轨道**里侧**，不是负偏移到盒子外——旧版 `left:-20px` 撞上 `overflow-y:auto`
   （它把 overflow-x 一并算成 auto），那条竖杠于是被裁在容器边上。 */
.toc nav{position:relative;padding-left:17px}
.toc nav::before{content:'';position:absolute;left:0;top:3px;bottom:3px;width:1px;background:var(--line)}
.toc nav + nav{margin-top:24px}
.toc a{position:relative;display:block;padding:9px 0;text-decoration:none;color:var(--dim);transition:color .16s ease}
/* 选中不用填色（ui.md §5）：填色会和语义色打架，而这一栏旁边就摆着三种语义色的正文 */
.toc a::before{content:'';position:absolute;left:-17px;top:4px;bottom:4px;width:2px;
  background:transparent;transition:background .16s ease}
.toc a:hover{color:var(--text)}
.toc a:hover::before{background:var(--dim-2)}
.toc a.on{color:var(--text)}
.toc a.on .t{font-weight:600}
.toc a.on::before{background:var(--accent)}
/* 两行都不许折行：折了就成了参差不齐的一堵字，而那行读数本来就是"扫一眼"的东西。
   写不下就截——章节栏是索引，完整值在纸上 */
.toc .t,.toc .s{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toc .t{font-size:13px;line-height:1.45}
.toc .s{margin-top:2px;font-family:var(--mono);font-size:10.5px;color:var(--dim-2);
  line-height:1.5;transition:color .16s ease}
.toc a.on .s{color:var(--dim)}
/* 交付自成一条轨道：它不是报告的一节，是读完之后要做的事 */
.toc a.deliver .t{color:var(--text);font-weight:500}
.toc a.deliver .s{color:var(--dim)}
.toc a.deliver .g{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--warn);margin-right:6px;vertical-align:1px}

/* ══════════ 纸 ══════════ */
/* ⚠️ 居中放在 `.paper` / `.handoff` 上，不放在 `.main` 上：
   `margin:0 auto` 会让 grid item 退成 fit-content，纸于是按最长那行文字收窄，
   与 1240 对不上——而这一屏的整个前提是屏上与图上同一个宽度 */
.main{min-width:0}
.paper{max-width:1240px;margin:0 auto;padding:56px 60px 0;font-size:15.5px;line-height:1.72}
.paper p{max-width:76ch}

/* 纸头两栏：左边是这次调查在问什么，右边是它的身份证。
   1240 的宽度本来就摊得开，挤在一行里读起来像状态栏。 */
.paper header{display:grid;grid-template-columns:1fr 216px;gap:44px;align-items:start}
.paper header h1{margin:0;font-size:25px;font-weight:600;letter-spacing:-.01em;line-height:1.3}
.paper header .question{margin:12px 0 0;color:var(--dim);font-size:14.5px}
.idcard{border-left:1px solid var(--line);padding-left:18px}
.idcard dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:2px 14px;line-height:1.75}
.idcard dt{color:var(--dim-2);font-size:11px}
.idcard dd{margin:0;font-family:var(--mono);color:var(--text);font-size:11.5px;text-align:right}

/* ── 形态条：所见即所得的落点 ────────────────────────────────
   点一下，下面整份纸当场换装。它长在纸头里，因为「这份按哪种装」本来就是纸头
   那行 stamp 说的事——只是屏幕上它可点，图片里它是一行字。 */
.shapebar{margin:26px 0 0;padding:14px 16px;background:var(--panel);border:1px solid var(--line);border-radius:8px}
.shapebar .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.shapebar .lead{font-size:12.5px;color:var(--dim);margin-right:4px}
.shapebar .row button[data-shape]{background:none;border:1px solid var(--line);color:var(--dim);padding:4px 12px;border-radius:6px;font-size:12.5px}
.shapebar .row button[data-shape]:hover{color:var(--text);border-color:var(--dim-2)}
.shapebar .row button[data-shape].on{border-color:var(--fill);color:var(--accent)}
.shapebar .row button[data-shape].thin{opacity:.5}
.shapebar .note{margin:10px 0 0;font-size:12px;color:var(--dim);display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.shapebar .note b{color:var(--text);font-weight:600}
.shapebar .src{font-family:var(--mono);font-size:11px;color:var(--dim-2)}
.shapebar .warn{color:var(--warn)}
.shapebar .revert{margin-left:auto;padding:3px 10px;font-size:11.5px}
/* 冻结之后它退成一行字：事后没有入口再改 */
.stamp{margin:26px 0 0;padding:12px 0 0;border-top:1px solid var(--line-soft);font-size:12.5px;color:var(--dim);display:flex;gap:12px;flex-wrap:wrap}
.stamp code{font-family:var(--mono);color:var(--text)}
.stamp .sealed{color:var(--accent)}

/* ── 章节 ── */
.paper section{margin-top:52px;scroll-margin-top:60px}
.paper h2{display:flex;align-items:baseline;gap:12px;margin:0 0 16px;padding-bottom:8px;
  border-bottom:1px solid var(--line);font-size:15.5px;font-weight:600}
.paper h2 em{margin-left:auto;font-style:normal;font-size:11.5px;color:var(--dim);font-family:var(--mono)}
.paper .none{margin:0;color:var(--dim)}

/* 根因提级：它是整份报告的答案，不该和「影响面」长一个样。 */
.rootblock{border-left:3px solid var(--fill);padding:2px 0 2px 22px;margin-top:18px}
.rootblock .big{margin:0;font-size:27px;line-height:1.36;font-weight:600;letter-spacing:-.01em;max-width:26ch}
.rootblock .conf{margin:14px 0 0;font-family:var(--mono);font-size:12px;color:var(--dim);display:flex;align-items:center;gap:10px}
.rootblock .bar{display:inline-block;width:120px;height:3px;background:var(--line);position:relative}
.rootblock .bar i{position:absolute;left:0;top:0;bottom:0;background:var(--accent)}

.contrast{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-top:18px}
.contrast>div{border-left:2px solid var(--line);padding-left:16px}
.contrast .is{border-left-color:var(--bad)}
.contrast .k{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.contrast p{margin:8px 0 0}

.axis{list-style:none;margin:18px 0 0;padding:0 0 0 26px;position:relative}
.axis::before{content:'';position:absolute;left:4px;top:12px;bottom:12px;width:1px;background:var(--line)}
.axis li{position:relative;display:grid;grid-template-columns:170px 1fr auto;gap:16px;padding:9px 0}
.axis .dot{position:absolute;left:-26px;top:15px;width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px var(--bg)}
.axis li.superseded .dot{background:var(--bg);border:1px solid var(--dim)}
.axis .when{font-family:var(--mono);font-size:13px;color:var(--dim)}
.axis .what b{margin-right:8px}
.axis li.superseded .what{color:var(--dim)}
.axis .from{font-family:var(--mono);font-size:11.5px;color:var(--dim)}

.chain{list-style:none;margin:18px 0 0;padding:0}
.chain li{display:flex;gap:14px;align-items:baseline;padding:12px 0;border-bottom:1px solid var(--line)}
.chain .n{font-family:var(--mono);color:var(--dim);min-width:38px}
.chain .what{flex:1}
.chain .what b{display:block;font-weight:600;font-size:14px}
.chain .what span{color:var(--dim);font-size:14px}
.chain .conf{font-family:var(--mono);font-size:12.5px;color:var(--dim)}
.chain .tag{font-size:11px;border:1px solid var(--line);color:var(--dim);padding:1px 8px;border-radius:4px}
.chain li.weak .tag.w{border-color:var(--bad);color:var(--bad)}
.chain .tag.root{border-color:var(--accent);color:var(--accent)}

.split{list-style:none;margin:18px 0 0;padding:0}
.split li{display:flex;gap:16px;align-items:baseline;padding:11px 0;border-bottom:1px solid var(--line)}
.split .who{font-family:var(--mono);min-width:180px}
.split .n{color:var(--accent);font-size:12.5px;min-width:84px}
.split .claims{flex:1;color:var(--dim);font-size:13px}

.matrix{width:100%;border-collapse:collapse;margin-top:18px;font-size:14.5px}
.matrix th{text-align:left;padding:0 24px 8px 0;border-bottom:1px solid var(--line);
  font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);font-weight:600}
.matrix td{padding:12px 24px 12px 0;border-bottom:1px solid var(--line);vertical-align:top}
.matrix td em{font-style:normal;color:var(--bad);font-size:12.5px;margin-left:8px}

.path{list-style:none;margin:18px 0 0;padding:0}
.path li{display:flex;gap:14px;align-items:baseline;padding:11px 0;border-bottom:1px solid var(--line)}
.path .n{font-family:var(--mono);color:var(--dim);min-width:38px}
.path li.confirmed .n{color:var(--accent)}
.path .what{flex:1}
.path .what em{font-style:normal;color:var(--dim);margin-left:12px}
.path li.superseded .what,.path li.refuted .what{text-decoration:line-through;color:var(--dim)}
.path .by{color:var(--bad);font-size:12.5px}
.path .cnt{font-family:var(--mono);font-size:11.5px;color:var(--dim)}

.notes{margin:18px 0 0;padding-left:20px}
.notes li{margin:10px 0;max-width:76ch}
.notes b{display:block;font-weight:600}

.paper footer{margin-top:60px;padding-top:16px;border-top:1px solid var(--line);
  font-family:var(--mono);font-size:12px;color:var(--dim)}

/* ══════════ 交付台 ══════════════════════════════════════════
   顶栏搬下来的那几件全在这儿，且**两种目标各摊开一份真预览**——没有浮层，
   要看的东西就在页面上。它在纸的外面，不进 Markdown、不进长图。 */
.handoff{max-width:1240px;margin:60px auto 0;padding:0 60px 120px;scroll-margin-top:60px}
.handoff .hd{display:flex;align-items:baseline;gap:14px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.handoff .hd h2{margin:0;font-size:15.5px;font-weight:600}
.handoff .hd em{font-style:normal;font-size:11.5px;color:var(--dim);margin-left:auto;font-family:var(--mono)}

/* 两种目标并排、等宽等位、按钮一个样：并列一等（D26），把其中一个做成次要按钮
   就等于替人选了一种。卡里只放**缩略**——它回答的是"这一份大概长什么样、多大、切几页"，
   完整那一份进浮层看 */
.targets{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:24px}
.target{background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden;display:flex;flex-direction:column}
.target .top{display:flex;align-items:baseline;gap:10px;padding:13px 16px}
.target .top h3{margin:0;font-size:14px;font-weight:600}
.target .top .spec{margin-left:auto;font-family:var(--mono);font-size:11.5px;color:var(--dim)}
.target .why{padding:0 16px 12px;font-size:12px;color:var(--dim)}
/* 缩略区定高，底下压一道同色渐隐：它明摆着是截断的，不假装自己是全文 */
.thumb{position:relative;height:196px;overflow:hidden;background:var(--code);
  border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.thumb::after{content:'';position:absolute;left:0;right:0;bottom:0;height:70px;
  background:linear-gradient(to bottom,transparent,var(--code))}
.thumb .shot{position:absolute;left:0;top:0;width:1240px;transform-origin:top left}
.thumb .md{margin:0;padding:14px 16px;font-family:var(--mono);font-size:10.5px;line-height:1.8;
  color:var(--dim);white-space:pre;overflow:hidden}
.target .acts{display:flex;gap:8px;padding:12px 16px}

/* 收尾：两档不可逆的手势，与上面可以按很多次的导出隔开一格 */
.close{margin-top:38px;padding-top:24px;border-top:1px solid var(--line-soft)}
.close h3{margin:0 0 8px;font-size:13px;font-weight:600}
.close p{margin:0;max-width:72ch;font-size:13px;color:var(--dim)}
.close p b{color:var(--text);font-weight:600}
.close .acts{display:flex;align-items:center;gap:10px;margin-top:16px;flex-wrap:wrap}
.close .gap{display:flex;align-items:center;gap:7px;margin-left:4px;font-size:12.5px;color:var(--warn)}
.close .gap .g{width:7px;height:7px;border-radius:50%;background:var(--warn)}
/* 就地展开的二次确认：不可逆的确认长在按下去的那个按钮旁边，不弹回顶部 */
.confirm{margin-top:16px;padding:14px 16px;background:#2E2415;border:1px solid #3D3018;border-radius:8px}
.confirm p{margin:0 0 12px;max-width:72ch;font-size:13px;color:#E8D9B6}
.confirm p b{color:#FFF3D8}
.confirm .acts{margin:0;display:flex;gap:8px}
.confirm .btn{background:none;border-color:#4A3A1E;color:#E8D9B6}
.confirm .btn.seal{background:var(--warn);border-color:var(--warn);color:var(--on-warn)}
.sealed-note{margin-top:38px;padding:14px 18px;background:var(--panel);border:1px solid var(--line);border-radius:8px;
  font-size:13px;color:var(--dim);display:flex;gap:10px;align-items:center}
.sealed-note b{color:var(--text);font-weight:600}

/* ══════════ 导出预览浮层 ══════════════════════════════════════
   它看的是**要交出去的那一份**，不是报告内容——所以它不受 D22「报告页不许有折叠」的约束：
   那一条防的是"截图里没有的内容"，而这一层压根不进任何一份导出。 */
.veil{position:fixed;inset:0;z-index:60;background:rgba(9,13,17,.72);display:none}
.veil.on{display:block}
.viewer{position:fixed;inset:40px 56px 74px;z-index:61;display:none;grid-template-rows:auto 1fr auto;
  background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 24px 70px rgba(0,0,0,.5);overflow:hidden}
.viewer.on{display:grid}
.viewer .bar{display:flex;align-items:center;gap:8px;padding:11px 16px;border-bottom:1px solid var(--line)}
.viewer .bar strong{font-size:13.5px;font-weight:600;margin-right:6px}
.viewer .bar button[data-tab]{background:none;border:1px solid var(--line);color:var(--dim);padding:4px 12px;border-radius:6px;font-size:12.5px}
.viewer .bar button[data-tab].on{border-color:var(--fill);color:var(--accent)}
.viewer .bar .x{margin-left:auto}
.viewer .body{overflow:auto;background:var(--code)}
.viewer pre{margin:0;padding:26px 30px;font-family:var(--mono);font-size:12.5px;line-height:1.9;
  color:var(--text);white-space:pre-wrap;word-break:break-word}

<script>
const ico = (n, s=15) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24"><use href="#i-${n}"/></svg>`;
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

/* ══════════════════════════════════════════════════════════════════
   数据：借预览夹具那个案子（订单重复记录），把 st1/st4 那类占位文本换成读得下去的句子
   ══════════════════════════════════════════════════════════════════ */
const SHAPES = {
  sequence:     {label:'时序型',  when:'顺序 / 竞态错了',      body:'系统时间线'},
  state:        {label:'状态型',  when:'某个东西一直就是错的', body:'应然 / 实然对照'},
  chain:        {label:'因果链型',when:'一处变更连锁放大',     body:'因果链 + 最弱一环'},
  distribution: {label:'分布型',  when:'问题只在某一小撮上',   body:'归因切分'},
  open:         {label:'未决型',  when:'没查出来',            body:'排除矩阵 + 遗留问题'},
};
const SHAPE_KEYS = Object.keys(SHAPES);

const D = {
  title:'订单提交产生了两条重复记录',
  question:'线上反馈：12:03 前后，用户 u1001 只提交了一次订单，系统里却出现了两条重复记录。请排查根因。',
  caseId:'c1', date:'2026-08-15', tz:'+08:00', evidence:11, steps:9,
  root:{text:'连接池在扩容时被复用了旧配置', conf:0.40, step:'#4'},
  expected:'扩容后每个实例各自建池，pool_size 按实例算',
  actual:'扩容后仍共用扩容前那一个池，pool_size 原样继承',
  timeline:[
    {t:'12:03:41.220', who:'order-api',  s:'confirmed',  from:'#1', c:'网关侧只收到一次 POST /orders，重复不是客户端重发'},
    {t:'12:03:41.887', who:'order-api',  s:'confirmed',  from:'#4', c:'扩容拉起的两个新实例都继承了扩容前那份 pool_size'},
    {t:'12:03:42.104', who:'mysql-prod', s:'confirmed',  from:'#4', c:'t_order 落下两行，cart_key 相同，主键相邻'},
    {t:'12:04:07.910', who:'gateway',    s:'superseded', from:'#2', c:'上游超时触发了一次重试（这条出自后来被推翻的那一步）'},
  ],
  chain:[
    {n:'#1', d:'重复是不是客户端重发的',  v:'网关侧只有一次请求，排除客户端', conf:0.90},
    {n:'#5', d:'唯一约束建上了没有',      v:'idx_cart_key 是 KEY 不是 UNIQUE KEY', conf:null},
    {n:'#4', d:'两个实例为什么会同时写',  v:'连接池在扩容时被复用了旧配置', conf:0.40, root:1, weak:1},
  ],
  split:[
    {who:'order-api',  n:6, c:'重复写入全部来自扩容拉起的两个实例'},
    {who:'mysql-prod', n:3, c:'唯一约束缺失，写入侧兜不住'},
    {who:'gateway',    n:2, c:'重试与本次重复无关'},
  ],
  matrix:[
    {d:'是不是上游超时导致网关重试', v:'上游全程正常，重试发生在写入之后', by:'#4'},
    {d:'是不是客户端重复提交',       v:'网关只收到一次 POST /orders', by:null},
  ],
  impact:'受影响的是 37 个租户，窗口是 12:00 到 12:10 这十分钟；重复记录共 214 条，其中 41 条已进入结算。',
  path:[
    {n:'#1', s:'confirmed',  d:'重复是不是客户端重发的', v:'网关侧只有一次请求', by:null, c:'3 次调用 · 2 条证据'},
    {n:'#2', s:'superseded', d:'是不是上游超时导致网关重试', v:'上游全程正常', by:'#4', c:'4 次调用 · 1 条证据'},
    {n:'#3', s:'confirmed',  d:'影响面：这十分钟里有多少租户中招', v:'37 个租户 · 214 条', by:null, c:'2 次调用 · 3 条证据'},
    {n:'#4', s:'confirmed',  d:'两个实例为什么会同时写', v:'连接池在扩容时被复用了旧配置', by:null, c:'6 次调用 · 4 条证据'},
    {n:'#5', s:'confirmed',  d:'换个角度：这张表的唯一约束建上了没有', v:'建表语句里是 KEY，不是 UNIQUE KEY', by:null, c:'1 次调用 · 1 条证据'},
    {n:'#6', s:'inconclusive', d:'重试为什么没兜住', v:'没查清', by:null, c:'2 次调用 · 0 条证据'},
  ],
  leftover:[{d:'重试为什么没兜住', v:'幂等键在重试路径上没生效，但没找到它是什么时候被绕过的。'}],
  fix:'把 pool_size 从 *继承* 改成按实例算，并给 [扩容流程] 补一条校验；同一轮把 idx_cart_key 改成 UNIQUE KEY，让写入侧兜得住。',
};

const SUGGEST = {shape:'chain', source:'agent'};
const STATE_FILLABLE = true;
const PAGE_MAX = 6000;   // 与 ExportImage.tsx 的 PAGE_MAX 同一个数
let shape = SUGGEST.shape, picked = false, sealed = false, legacy = false, confirming = null, view = null;

/* ── 章节组装：镜像 shared/report.ts 的 reportPlan() ─────────────
   `sum` 是章节栏那行小字：它是这一节的读数，不是标题的一部分。 */
function plan(){
  const S = [];
  if (shape !== 'open') S.push({id:'verdict', t:'根因', sum:`置信度 ${D.root.conf.toFixed(2)}`, src:'投影 · 置信度最高的那条已证实结论', k:'verdict'});
  if (shape === 'sequence') S.push({id:'timeline', t:'系统时间线', sum:`${D.timeline.length} 条证据`, src:'投影 · ORDER BY occurred_at_ms', k:'timeline'});
  if (shape === 'state') {
    S.push({id:'contrast', t:'应然 / 实然', sum:'agent 填的一对', src:'agent 填写 · 挂在根因那一步', k:'contrast'});
    S.push({id:'timeline', t:'系统时间线', sum:'这一形态不投影', src:'——', k:'absent',
      why:'状态型故障没有"事发瞬间"：它一直就是错的，直到被发现。硬排一条时间线只会得到「某天变更、某天发现」两行，还会把真正该看的应然 / 实然对照挤到后面去。'});
  }
  if (shape === 'chain') S.push({id:'chain', t:'因果链', sum:`${D.chain.length} 环 · 最弱 ${D.chain.find(l=>l.weak).n}`, src:'投影 · 已证实的 step 按先后', k:'chain'});
  if (shape === 'distribution') S.push({id:'split', t:'归因切分', sum:`切成 ${D.split.length} 组`, src:'投影 · 证据按 actor 归组', k:'split'});
  if (shape === 'open') {
    S.push({id:'matrix', t:'排除矩阵', sum:`排除 ${D.matrix.length} 个方向`, src:'投影 · 被推翻的 step', k:'matrix'});
    S.push({id:'leftover', t:'遗留问题', sum:`${D.leftover.length} 条`, src:'投影 · 未查清的 step', k:'leftover'});
  }
  S.push({id:'impact', t:'影响面', sum:'37 个租户', src:'投影 · 影响面 step 的结论', k:'prose', text:D.impact});
  S.push({id:'path', t:'排查路径', sum:`${D.steps} 步 · 1 处推翻`, src:'投影 · step 树，含走错的分支', k:'path'});
  if (shape !== 'open') S.push({id:'leftover', t:'遗留问题', sum:`${D.leftover.length} 条`, src:'投影 · 未查清的 step', k:'leftover'});
  S.push({id:'fix', t:'修复建议', sum:'agent 生成', src:'agent 生成 · 挂在给出判断的那一步上', k:'prose', text:D.fix});
  return S;
}

function bodyHTML(s){
  switch(s.k){
    case 'verdict': return `<div class="rootblock">
        <p class="big">${esc(D.root.text)}</p>
        <p class="conf">置信度 ${D.root.conf.toFixed(2)}
          <span class="bar"><i style="width:${D.root.conf*100}%"></i></span>
          <span>出自 ${D.root.step}</span></p></div>`;
    case 'contrast': return `<div class="contrast">
        <div><span class="k">本该</span><p>${esc(D.expected)}</p></div>
        <div class="is"><span class="k">实际</span><p>${esc(D.actual)}</p></div></div>`;
    case 'absent': return `<p class="none">${esc(s.why)}</p>`;
    case 'timeline': return `<ol class="axis">${D.timeline.map(r=>`<li class="${r.s}">
        <span class="dot"></span><span class="when">${r.t}</span>
        <span class="what"><b>${r.who}</b>${esc(r.c)}</span>
        <span class="from">${r.from}</span></li>`).join('')}</ol>`;
    case 'chain': return `<ol class="chain">${D.chain.map(l=>`<li class="${l.weak?'weak':''}">
        <span class="n">${l.n}</span>
        <span class="what"><b>${esc(l.d)}</b><span>${esc(l.v)}</span></span>
        ${l.conf!==null?`<span class="conf">${l.conf.toFixed(2)}</span>`:''}
        ${l.weak?'<span class="tag w">最弱一环</span>':''}
        ${l.root?'<span class="tag root">根因</span>':''}</li>`).join('')}</ol>`;
    case 'split': return `<ul class="split">${D.split.map(g=>`<li>
        <span class="who">${g.who}</span><span class="n">${g.n} 条证据</span>
        <span class="claims">${esc(g.c)}</span></li>`).join('')}</ul>
      <div class="contrast">
        <div><span class="k">干净的那组</span><p>${esc(D.expected)}</p></div>
        <div class="is"><span class="k">出问题的那组</span><p>${esc(D.actual)}</p></div></div>`;
    case 'matrix': return `<table class="matrix"><thead><tr><th>查过的方向</th><th>结论</th></tr></thead>
      <tbody>${D.matrix.map(r=>`<tr><td>${esc(r.d)}</td><td>${esc(r.v)}${r.by?`<em>← 被 ${r.by} 推翻</em>`:''}</td></tr>`).join('')}</tbody></table>`;
    case 'path': return `<ol class="path">${D.path.map(p=>`<li class="${p.s}">
        <span class="n">${p.n}</span>
        <span class="what">${esc(p.d)}<em>${esc(p.v)}</em></span>
        ${p.by?`<span class="by">← 被 ${p.by} 推翻</span>`:''}
        <span class="cnt">${p.c}</span></li>`).join('')}</ol>`;
    case 'leftover': return `<ul class="notes">${D.leftover.map(l=>`<li><b>${esc(l.d)}</b>${esc(l.v)}</li>`).join('')}</ul>`;
    case 'prose': return `<p>${esc(s.text)}</p>`;
  }
}

/* 纸头。**形态条只在屏幕上出现**：真实实现里它作为一个可选 node 传进 ReportPaper，
   长图那份不传——控件因此不可能漏进导出，不靠"记得删"。 */
function headHTML(forExport){
  const sh = SHAPES[shape];
  const src = picked ? '你选的' : SUGGEST.source==='agent' ? 'agent 声明的' : '没人声明过，按现有数据推的';
  const control = (!forExport && !sealed) ? `
    <div class="shapebar">
      <div class="row">
        <span class="lead">这份报告按哪种装</span>
        ${SHAPE_KEYS.map(k=>`<button data-shape="${k}" class="${k===shape?'on':''} ${k==='state'&&!STATE_FILLABLE?'thin':''}"
           title="${SHAPES[k].when} —— 主体是${SHAPES[k].body}">${SHAPES[k].label}</button>`).join('')}
        ${picked?`<button class="btn quiet revert" id="revert">${ico('undo',13)}还原成 agent 声明的</button>`:''}
      </div>
      <div class="note">
        <span><b>${sh.label}</b>：${sh.when}，主体是<b>${sh.body}</b></span>
        <span class="src">${src}</span>
      </div>
    </div>` : `
    <p class="stamp">
      <span>按${sh.label}装 · 主体是${sh.body}</span>
      <span>基准日期 <code>${D.date}</code> ${D.tz}</span>
      ${sealed&&!forExport?'<span class="sealed">已定稿 · 2026-08-15 14:02 · 形态与内容都冻住了</span>':''}
    </p>`;
  return `<header>
      <div><h1>${esc(D.title)}</h1><p class="question">${esc(D.question)}</p></div>
      <div class="idcard"><dl>
        <dt>Case</dt><dd>${D.caseId}</dd>
        <dt>基准日期</dt><dd>${D.date}</dd>
        <dt>时区</dt><dd>${D.tz}</dd>
        <dt>步数</dt><dd>${D.steps}</dd>
        <dt>证据</dt><dd>${D.evidence}</dd>
      </dl></div>
    </header>${control}`;
}

function paperHTML(forExport){
  return headHTML(forExport)
    + plan().map(s=>`<section id="sec-${s.id}"><h2>${s.t}<em>${s.src}</em></h2>${bodyHTML(s)}</section>`).join('')
    + `<footer>Case ${D.caseId}${forExport?' · 2026-08-15 14:02':''} · ${D.evidence} 条证据可在 Inquestry 溯源</footer>`;
}

/* ── Markdown：照 ui.md §7.1（引用块置顶、表格不用 mermaid、证据走脚注） ── */
function markdown(){
  const L = [];
  L.push(`# ${D.title}`, '');
  if (shape !== 'open') L.push(`> **${D.root.text}**`, `> 置信度 ${D.root.conf.toFixed(2)} · 出自 ${D.root.step}`, '');
  else L.push('> 这次调查被人为终止，**没有根因**。以下是查到为止的部分。', '');
  L.push(`按${SHAPES[shape].label}装 · 主体是${SHAPES[shape].body} · 基准日期 \`${D.date}\` ${D.tz}`, '', `> ${D.question}`, '');
  if (shape === 'sequence') {
    L.push('## 系统时间线', '', '| 时刻 | 主体 | 发生了什么 | 出自 |', '| --- | --- | --- | --- |');
    D.timeline.forEach((r,i)=>L.push(`| \`${r.t}\` | ${r.who} | ${r.s==='superseded'?'~~'+r.c+'~~':r.c}[^e${i+1}] | ${r.from} |`));
    L.push('');
  }
  if (shape === 'state') L.push('## 应然 / 实然', '', `- **本该**：${D.expected}`, `- **实际**：${D.actual}`, '',
    '## 系统时间线', '', '状态型故障没有"事发瞬间"，这一节不投影。', '');
  if (shape === 'chain') {
    L.push('## 因果链', '');
    D.chain.forEach(l=>L.push(`${l.n} **${l.d}** ${l.v}${l.conf!==null?` \`${l.conf.toFixed(2)}\``:''}${l.weak?' *(最弱一环)*':''}${l.root?' *(根因)*':''}`));
    L.push('');
  }
  if (shape === 'distribution') {
    L.push('## 归因切分', '', '| 主体 | 证据数 | 说明 |', '| --- | --- | --- |');
    D.split.forEach(g=>L.push(`| ${g.who} | ${g.n} | ${g.c} |`)); L.push('');
  }
  if (shape === 'open') {
    L.push('## 排除矩阵', '', '| 查过的方向 | 结论 |', '| --- | --- |');
    D.matrix.forEach(r=>L.push(`| ${r.d} | ${r.v}${r.by?` (被 ${r.by} 推翻)`:''} |`)); L.push('');
    L.push('## 遗留问题', ''); D.leftover.forEach(l=>L.push(`- **${l.d}** ${l.v}`)); L.push('');
  }
  L.push('## 影响面', '', D.impact, '', '## 排查路径', '');
  D.path.forEach(p=>L.push(`${p.n} ${p.s==='superseded'?`~~${p.d}~~ ${p.v}（被 ${p.by} 推翻）`:`${p.d} ${p.v}`} · ${p.c}`));
  if (shape !== 'open'){ L.push('', '## 遗留问题', ''); D.leftover.forEach(l=>L.push(`- **${l.d}** ${l.v}`)); }
  L.push('', '## 修复建议', '', D.fix.replace(/[*[\]]/g, c=>'\\'+c), '', '---', '', '### 证据索引', '');
  D.timeline.forEach((r,i)=>L.push(`[^e${i+1}]: \`${r.t}\` · ${r.who} · \`demo_query\` · line 42`));
  L.push('', '<details><summary>mermaid 版时间线（附加）</summary>', '', '```mermaid', 'timeline', '```', '', '</details>', '',
    `Case ${D.caseId} · 2026-08-15 14:02 · ${D.evidence} 条证据可在 Inquestry 溯源`);
  return L.join('\n');
}

/* ══════════ 渲染 ══════════ */
/* 顶栏右端就这一枚，与工作区那两枚同一个位置、同一个样子。
   调查标题不往这儿放：纸头第一行就是它，同一句话印两遍只是噪声。 */
function renderTop(){
  $('#topacts').innerHTML = `<button class="btn">${ico('back')}工作区</button>`;
  $('#legacybar').className = legacy ? 'legacybar' : '';
  $('#legacybar').innerHTML = legacy
    ? `<button class="btn">${ico('back')}工作区</button>
       <button class="btn go">${ico('download')}导出 Markdown</button>
       <button class="btn go">${ico('download')}导出长图</button>
       <button class="btn quiet">${ico('seal')}定稿（差 1 步）</button>
       <button class="btn quiet">${ico('archive')}归档</button>
       ${plan().map(s=>`<a href="#sec-${s.id}">${s.t}</a>`).join('')}`
    : '';
}

function renderToc(){
  const secs = plan();
  $('#toc').innerHTML = `<nav>` + secs.map(s=>
      `<a href="#sec-${s.id}" data-sec="sec-${s.id}"><span class="t">${s.t}</span><span class="s">${s.sum}</span></a>`).join('')
    + `</nav><nav>
         <a href="#handoff" data-sec="handoff" class="deliver">
           <span class="t">${(!sealed?'<span class="g"></span>':'')}交付</span>
           <span class="s">${sealed?'已定稿 · 只能导出':'导出 · 定稿 · 归档'}</span></a>
       </nav>`;
}

/* 把这份纸按 1240 真排一遍再量，按 PAGE_MAX 切页。缩略图是排完之后缩的，不是画的示意。
   ⚠️ 同步量，不走 rAF：窗口没获焦点时 rAF 一次都不回调（ui.md §11） */
function measureShot(){
  const probe = document.createElement('div');
  probe.style.cssText = 'position:absolute;left:-99999px;top:0;width:1240px';
  probe.innerHTML = `<article class="paper" style="padding:56px 60px 40px">${paperHTML(true)}</article>`;
  document.body.appendChild(probe);
  const h = probe.scrollHeight;
  probe.remove();
  const pages = Math.max(1, Math.ceil(h / PAGE_MAX));
  return {h, pages, per: Math.ceil(h / pages)};
}
const shotPaper = () => `<article class="paper" style="padding:56px 60px 40px">${paperHTML(true)}</article>`;

function renderHandoff(){
  const md = markdown();
  const kb = (new Blob([md]).size/1024).toFixed(1);
  const {h, pages} = measureShot();
  $('#handoff').innerHTML = `
    <div class="hd" id="handoff-anchor"><h2>交付</h2><em>以下不进报告本身</em></div>

    <div class="targets">
      <div class="target">
        <div class="top"><h3>长图</h3>
          <span class="spec">1240 × ${h} @2x · ${pages>1?`${pages} 张`:'单页'}</span></div>
        <p class="why">给一贴进群里就要被看懂的场合</p>
        <div class="thumb"><div class="shot" id="cardshot">${shotPaper()}</div></div>
        <div class="acts"><button class="btn" data-view="img">${ico('expand')}看全图</button>
          <button class="btn go">${ico('download')}导出长图</button></div>
      </div>

      <div class="target">
        <div class="top"><h3>Markdown</h3>
          <span class="spec">report-${D.caseId}.md · ${md.split('\n').length} 行 · ${kb} KB</span></div>
        <p class="why">给会被继续编辑、被贴进 PR 的场合</p>
        <div class="thumb"><pre class="md">${esc(md.split('\n').slice(0,16).join('\n'))}</pre></div>
        <div class="acts"><button class="btn" data-view="md">${ico('expand')}看全文</button>
          <button class="btn go">${ico('download')}导出 Markdown</button></div>
      </div>
    </div>

    ${sealed ? `
      <div class="sealed-note">${ico('seal',16)}<b>已定稿</b>
        <span>形态冻在 <b>${SHAPES[shape].label}</b> · 2026-08-15 14:02 · 不能再开会话，只能导出。</span></div>`
    : `
      <div class="close">
        <h3>收尾</h3>
        <p>定稿会冻结这次调查：不能再开会话，只能导出。冻的就是你上面选的那一份 ——
           形态 <b>${SHAPES[shape].label}</b>，根因取 <b>「${D.root.text}」</b>。</p>
        <div class="acts">
          <button class="btn" data-ask="closed">${ico('seal')}定稿</button>
          <button class="btn quiet" data-ask="aborted">${ico('archive')}归档</button>
          ${confirming?'':'<span class="gap"><span class="g"></span>影响面这一步还没做，点定稿会先让 agent 去补</span>'}
        </div>
        ${confirming===null?'':confirmHTML()}
      </div>`}
  `;
  // 缩略图按卡片实际宽度缩：同步读一次布局就够，别等帧
  const shot = $('#cardshot');
  if (shot) shot.style.transform = `scale(${shot.parentElement.clientWidth / 1240})`;
}

/* 导出预览：两种目标切一下就看完整的那一份。
   长图是按真实分页切开的整页缩略，Markdown 是可复制的真源码。 */
function openView(kind){
  view = kind;
  $('#veil').classList.add('on');
  $('#viewer').classList.add('on');
  document.querySelectorAll('#viewer [data-tab]').forEach(b => b.classList.toggle('on', b.dataset.tab === kind));
  $('#closeview').innerHTML = `${ico('deny')}关闭`;
  const body = $('#viewbody');
  if (kind === 'md'){
    body.innerHTML = `<pre>${esc(markdown())}</pre>`;
    $('#viewfoot').textContent = `report-${D.caseId}.md · 除末尾一个 details 外全篇纯 Markdown · 证据走脚注`;
    $('#viewacts').innerHTML = `<button class="btn">${ico('copy')}复制全文</button>
      <button class="btn go">${ico('download')}导出 Markdown</button>`;
    return;
  }
  const {h, pages, per} = measureShot();
  const W = 640, k = W / 1240;
  body.innerHTML = `<div class="pages">${Array.from({length: pages}, (_, i) => `
      <div class="pageshot" style="width:${W}px;height:${Math.round(Math.min(per, h - i*per) * k)}px">
        <div class="shot" style="transform:scale(${k}) translateY(${-i*per}px)">${shotPaper()}</div>
      </div>
      <span class="pagecap">${pages>1?`第 ${i+1} / ${pages} 张`:'单页'}</span>`).join('')}</div>`;
  $('#viewfoot').textContent =
    `1240 × ${h} @2x · ${pages>1?`分 ${pages} 张，文件名加 -N`:'单页，保持你选的文件名'} · 配色不跟随系统主题`;
  $('#viewacts').innerHTML = `<button class="btn go">${ico('download')}导出长图</button>`;
}
function closeView(){ view = null; $('#veil').classList.remove('on'); $('#viewer').classList.remove('on'); }

/* 就地展开的二次确认：不可逆那一下的确认长在按下去的那个按钮下面。
   说的是**后果**不是"你确定吗"——两档的后果不一样，说反了就白确认了。 */
function confirmHTML(){
  const t = confirming === 'closed'
    ? `按下去之后这次调查就<b>冻住</b>了：不能再开会话，报告只能导出、不能再改。
       形态冻成 <b>${SHAPES[shape].label}</b>，根因取 <b>「${D.root.text}」</b>（置信度 ${D.root.conf.toFixed(2)}）。`
    : `归档 = <b>明写放弃</b>这次调查。已经查到的证据一条都不删，仍能导出半程报告 ——
       但那份强制是<b>未决型</b>，没有根因栏，主体是排除掉的方向与遗留问题。`;
  return `<div class="confirm">
    <p>${t}</p>
    <div class="acts">
      <button class="btn seal" id="do-confirm">${ico(confirming==='closed'?'seal':'archive')}${confirming==='closed'?'确认定稿':'确认归档'}</button>
      <button class="btn" id="do-cancel">${ico('deny')}再想想</button>
    </div></div>`;
}

function render(){
  $('#paper').innerHTML = paperHTML(false);
  renderTop(); renderToc(); renderHandoff(); spy();
}

/* 章节栏跟着滚动走。
   🔴 **`scroll` 事件本身也是帧驱动的**：实测在不获焦点的窗口里一次都不派发
   （Chrome 把它挂在合成器提交上）。rAF / IntersectionObserver 是同一族，换哪个都一样。
   真人在读报告时窗口是获焦的，所以这条在生产路径上成立；但
   **无人值守探针拍出来的报告屏，高亮会永远停在第一节**——那不是 bug，别去追。
   点击章节栏这条路不受影响：它自己同步调一次。 */
function spy(){
  const host = $('#screen');
  const marks = [...document.querySelectorAll('#paper section, #handoff')];
  const top = host.getBoundingClientRect().top + 80;
  let cur = marks[0];
  for (const m of marks) if (m.getBoundingClientRect().top <= top) cur = m;
  // 🔴 **到底了就认最后一节**：末节比一屏矮时它永远顶不到判定线，滚到底了高亮还停在上一节，
  // 点章节栏最后那一格于是"点了没反应"。末节正是交付，也就是最容易被这条坑到的那一格
  if (host.scrollTop >= host.scrollHeight - host.clientHeight - 2) cur = marks[marks.length - 1];
  const id = cur === $('#handoff') ? 'handoff' : cur.id;
  document.querySelectorAll('#toc a').forEach(a => a.classList.toggle('on', a.dataset.sec === id));
}
$('#screen').addEventListener('scroll', spy, {passive:true});

/* ── 事件 ── */
document.addEventListener('click', e=>{
  const a = e.target.closest('#toc a, .legacybar a');
  if (a){
    e.preventDefault();
    const host = $('#screen');
    const el = document.querySelector(a.getAttribute('href').replace('#handoff','#handoff-anchor'));
    if (el) host.scrollTop += el.getBoundingClientRect().top - host.getBoundingClientRect().top - 62;
    spy(); return;
  }
  const v = e.target.closest('[data-view], [data-tab]');
  if (v){ openView(v.dataset.view ?? v.dataset.tab); return; }
  if (e.target.closest('#closeview') || e.target.id === 'veil'){ closeView(); return; }
  const b = e.target.closest('[data-shape]');
  if (b){ shape = b.dataset.shape; picked = shape !== SUGGEST.shape; confirming = null; render();
          if (view) openView(view); return; }
  const ask = e.target.closest('[data-ask]');
  if (ask){ confirming = ask.dataset.ask; renderHandoff(); $('.confirm')?.scrollIntoView({block:'nearest'}); return; }
  if (e.target.closest('#revert')){ shape = SUGGEST.shape; picked = false; render(); return; }
  if (e.target.closest('#do-cancel')){ confirming = null; renderHandoff(); return; }
  if (e.target.closest('#do-confirm')){ sealed = true; confirming = null; sync(); render(); $('#screen').scrollTop = 0; return; }
  if (e.target.id === 'm-open'){ sealed=false; legacy=false; confirming=null; sync(); render(); return; }
  if (e.target.id === 'm-sealed'){ sealed=true; legacy=false; confirming=null; sync(); render(); return; }
  if (e.target.id === 'm-legacy'){ legacy=!legacy; sync(); render(); return; }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') { view = null; closeView(); } });
function sync(){
  $('#m-open').classList.toggle('on', !sealed && !legacy);
  $('#m-sealed').classList.toggle('on', sealed && !legacy);
  $('#m-legacy').classList.toggle('on', legacy);
}

sync(); render();
</script>
</body>
</html>
