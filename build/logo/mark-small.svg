<!-- Inquestry 小尺寸标记：同一条线，结收松一档、笔画加粗，证据点从三个减到两个。
     三个 6.5pt 的点在 40px 以下会并成一段实线，那就不再是「点」了。 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <path d="M22 76 C0 66 4 26 28 22 C50 19 54 48 30 50 C12 51 14 32 34 34 C44 35 49 44 50 52"
        fill="none" stroke="#6F7C89" stroke-width="8.5" stroke-linecap="round"/>
  <path d="M50 52 H85" fill="none" stroke="#93A0AC" stroke-width="8.5" stroke-linecap="round"/>
  <circle cx="68" cy="52" r="7.5" fill="#5A9EDD"/>
  <circle cx="85" cy="52" r="7.5" fill="#E0A94A"/>
</svg>
